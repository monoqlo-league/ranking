<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONOQLO PTランキング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f2;--surface:#ffffff;--ink:#17201b;--muted:#5d6b63;--line:#dde3dd;
  --accent:#1d6a4f;--accent-soft:#e2efe8;--plus:#1d6a4f;--minus:#b23a2e;
  --r1:#1d6a4f;--r2:#6fa58c;--r3:#c9b98f;--r4:#c7695c;
  --gold:#b58a1f;--stalk:#8dbb6a;--node:#5f8f45;--leaf:#4f9a4a;--silver:#7d8791;--bronze:#9a5f35;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#101512;--surface:#171e1a;--ink:#e6ece8;--muted:#98a69e;--line:#2a332e;
  --accent:#6cc39c;--accent-soft:#1d2d25;--plus:#6cc39c;--minus:#f0877a;
  --r1:#4fae86;--r2:#3a6f58;--r3:#8a7d5c;--r4:#b25a4e;
  --gold:#e0b84a;--stalk:#4f7a3c;--node:#3a5c2c;--leaf:#3f7a3a;--silver:#aab3bb;--bronze:#cf8c5a;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#101512;--surface:#171e1a;--ink:#e6ece8;--muted:#98a69e;--line:#2a332e;
  --accent:#6cc39c;--accent-soft:#1d2d25;--plus:#6cc39c;--minus:#f0877a;
  --r1:#4fae86;--r2:#3a6f58;--r3:#8a7d5c;--r4:#b25a4e;
  --gold:#e0b84a;--stalk:#4f7a3c;--node:#3a5c2c;--leaf:#3f7a3a;--silver:#aab3bb;--bronze:#cf8c5a;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.6;padding-inline:16px;padding-block:32px 48px}
.wrap{max-width:880px;margin:0 auto;display:grid;gap:24px}
header{display:grid;gap:6px}
.brand{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.htext{display:grid;gap:6px;min-width:0}
.panda{flex:none;order:2;width:96px;height:96px;margin-top:-6px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.14))}
.bamboo{position:fixed;left:0;bottom:0;width:min(220px,34vw);height:auto;z-index:0;pointer-events:none;opacity:.9}
.wrap{position:relative;z-index:1}
@media (max-width:600px){.panda{width:64px;height:64px}.bamboo{opacity:.5}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
h1{font-size:clamp(26px,5vw,36px);font-weight:900;line-height:1.25;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 18px}
.meta b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.search{flex:1 1 220px;max-width:320px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:780px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;position:sticky;top:0;background:var(--surface)}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
th button[aria-sort] ::after{content:""}
th .arrow{font-size:10px;opacity:.35}
th button.on{color:var(--ink)} th button.on .arrow{opacity:1;color:var(--accent)}
th.l,td.l{text-align:left}
td.rank{font-family:"IBM Plex Mono",monospace;font-weight:600;width:3.5em;text-align:center}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:13px}
.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
td.name{font-weight:700;max-width:14em;overflow:hidden;text-overflow:ellipsis}
td.pt{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px}
.plus{color:var(--plus)}.minus{color:var(--minus)}
td.num{font-family:"IBM Plex Mono",monospace;font-size:14px}
.bar{display:flex;width:120px;height:10px;border-radius:3px;overflow:hidden;background:var(--line);margin-left:auto}
.bar span:nth-child(1){background:var(--r1)}.bar span:nth-child(2){background:var(--r2)}.bar span:nth-child(3){background:var(--r3)}.bar span:nth-child(4){background:var(--r4)}
.counts{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-top:3px}
tbody tr:hover td{background:var(--accent-soft)}
tr.top td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}

.pname{all:unset;cursor:pointer;font-weight:700;border-bottom:1px dashed var(--muted);max-width:14em;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.pname:hover{color:var(--accent);border-bottom-color:var(--accent)}
.pname:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 48px)}
dialog::backdrop{background:rgba(10,20,15,.45)}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:20px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dhead h2{margin:0;font-size:22px;font-weight:900;line-height:1.3;word-break:break-all}
.dsub{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 14px}
.dsub b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink)}
.close{all:unset;cursor:pointer;flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;font-size:20px;color:var(--muted)}
.close:hover{background:var(--accent-soft);color:var(--ink)}
.close:focus-visible{outline:2px solid var(--accent)}
.dbody{padding:12px 20px 20px}
.dnote{font-size:12px;color:var(--muted);margin:0 0 10px}
.vs{min-width:540px}
.vs td,.vs th{padding:8px 10px}
.vs th{position:static}
.vs .oppbtn{all:unset;cursor:pointer;font-weight:700}
.vs .oppbtn:hover{color:var(--accent)}
.vs .oppbtn:focus-visible{outline:2px solid var(--accent);border-radius:3px}
.orank{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
.wbar{display:inline-block;width:56px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--minus) 55%,transparent);overflow:hidden;vertical-align:middle;margin-right:8px}
.wbar span{display:block;height:100%;background:var(--plus)}
.dtbox{overflow-x:auto}
.views{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.past{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-bottom:8px}
.past select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.past select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty{padding:24px;text-align:center;color:var(--muted)}
footer{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
  <svg class="panda" viewBox="0 0 100 100" role="img" aria-label="中牌を持つパンダ"><ellipse cx="34" cy="93" rx="11" ry="6.5" fill="#2b2d31"/><ellipse cx="66" cy="93" rx="11" ry="6.5" fill="#2b2d31"/><ellipse cx="50" cy="79" rx="27" ry="17" fill="#fff" stroke="#2b2d31" stroke-width="2.4"/><circle cx="21" cy="19" r="11.5" fill="#2b2d31"/><circle cx="79" cy="19" r="11.5" fill="#2b2d31"/><circle cx="21" cy="19" r="5.52" fill="#f4b8c3"/><circle cx="79" cy="19" r="5.52" fill="#f4b8c3"/><ellipse cx="50" cy="43" rx="35" ry="29" fill="#fff" stroke="#2b2d31" stroke-width="2.4"/><ellipse cx="34" cy="44.5" rx="9.5" ry="12" transform="rotate(32 34 44.5)" fill="#2b2d31"/><ellipse cx="66" cy="44.5" rx="9.5" ry="12" transform="rotate(-32 66 44.5)" fill="#2b2d31"/><circle cx="35.5" cy="43" r="5.2" fill="#fff"/><circle cx="35.9" cy="43.7" r="3.74" fill="#2b2d31"/><circle cx="34.4" cy="42" r="1.56" fill="#fff"/><circle cx="37.1" cy="45" r=".7" fill="#fff"/><circle cx="64.5" cy="43" r="5.2" fill="#fff"/><circle cx="64.9" cy="43.7" r="3.74" fill="#2b2d31"/><circle cx="63.4" cy="42" r="1.56" fill="#fff"/><circle cx="66.1" cy="45" r=".7" fill="#fff"/><ellipse cx="50" cy="52" rx="3.4" ry="2.3" fill="#2b2d31"/><path d="M44.6 55.6 q2.7 3.2 5.4 0 q2.7 3.2 5.4 0" fill="none" stroke="#2b2d31" stroke-width="1.7" stroke-linecap="round"/><ellipse cx="24.5" cy="54" rx="6" ry="3.6" fill="#f7a8b8" opacity=".8"/><ellipse cx="75.5" cy="54" rx="6" ry="3.6" fill="#f7a8b8" opacity=".8"/><rect x="39.0" y="66.6" width="22" height="26" rx="3.5" fill="#3f8f5a"/><rect x="39.0" y="64.0" width="22" height="26" rx="3.5" fill="#fffaf0" stroke="#d9cfb4" stroke-width="1"/><text x="50" y="83.1" text-anchor="middle" font-size="17" font-weight="900" fill="#d23c3c" font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic','Noto Sans CJK JP',sans-serif">中</text><ellipse cx="37.4" cy="82.7" rx="6.5" ry="5.9" fill="#2b2d31"/><ellipse cx="62.6" cy="82.7" rx="6.5" ry="5.9" fill="#2b2d31"/></svg>
  <div class="htext">
  <div class="eyebrow">MONOQLO麻雀部</div>
  <h1 id="ttl">PTランキング</h1>
  <div class="meta" id="meta"><span>読み込み中…</span></div>
  </div>
  </div>
</header>
<div class="tools">
  <input id="q" class="search" type="search" placeholder="プレイヤー名で検索" aria-label="プレイヤー名で検索">
  <div class="legend"><span><i style="background:var(--r1)"></i>1位</span><span><i style="background:var(--r2)"></i>2位</span><span><i style="background:var(--r3)"></i>3位</span><span><i style="background:var(--r4)"></i>4位</span></div>
</div>
<div class="views">
  <div class="tabs" role="tablist" aria-label="表示するランキング">
    <button class="tab" role="tab" id="tabMonth" aria-selected="true">今月のランキング</button>
    <button class="tab" role="tab" id="tabTotal" aria-selected="false">通算ランキング</button>
  </div>
  <label class="past">過去のランキング
    <select id="month" aria-label="過去のランキングを選ぶ"></select>
  </label>
</div>
<div class="tablebox">
<table>
<thead><tr>
 <th style="text-align:center">順位</th><th class="l">プレイヤー</th>
 <th><button data-k="pt" class="on">合計PT<span class="arrow">▼</span></button></th>
 <th><button data-k="n">対局数<span class="arrow">▼</span></button></th>
 <th><button data-k="avg">平均PT<span class="arrow">▼</span></button></th>
 <th><button data-k="ar">平均順位<span class="arrow">▲</span></button></th>
 <th><button data-k="top">トップ率<span class="arrow">▼</span></button></th>
 <th><button data-k="avoid">ラス回避率<span class="arrow">▼</span></button></th>
 <th>着順分布</th>
</tr></thead>
<tbody id="tb"><tr><td colspan="9" class="empty">読み込み中…</td></tr></tbody>
</table>
</div>
<footer>順位は合計PTの高い順。見出しの「対局数」「平均PT」「平均順位」「トップ率」「ラス回避率」を押すと並べ替えできる(順位列は合計PT順のまま)。プレイヤー名を押すと、同卓した相手ごとの相性表が開く。</footer>

</div>

<dialog id="dlg" aria-labelledby="dname">
  <div class="dhead"><div><h2 id="dname"></h2><div class="dsub" id="dsub"></div></div><button class="close" id="dclose" aria-label="閉じる">×</button></div>
  <div class="dbody">
    <p class="dnote">同卓した対局だけで集計した、このプレイヤーの成績。獲得PTの高い順(相性の良い順)。先着率は相手より上の順位で終えた割合。</p>
    <div class="dtbox"><table class="vs"><thead><tr><th class="l">対戦相手</th><th>同卓数</th><th>獲得PT</th><th>平均PT</th><th class="l">先着率</th></tr></thead><tbody id="vtb"></tbody></table></div>
  </div>
</dialog>

th d="M0 0 Q19.8 -9 44 0 Q19.8 9 0 0Z" transform="translate(30 100) rotate(200)" fill="var(--leaf)"/><path d="M0 0 Q17.1 -9 38 0 Q17.1 9 0 0Z" transform="translate(30 98) rotate(160)" fill="var(--leaf)"/><path d="M0 0 Q18.900000000000002 -9 42 0 Q18.900000000000002 9 0 0Z" transform="translate(89 140) rotate(-20)" fill="var(--leaf)"/><path d="M0 0 Q16.2 -9 36 0 Q16.2 9 0 0Z" transform="translate(89 142) rotate(-55)" fill="var(--leaf)"/><path d="M0 0 Q18.0 -9 40 0 Q18.0 9 0 0Z" transform="translate(78 175) rotate(195)" fill="var(--leaf)"/><path d="M0 0 Q17.1 -9 38 0 Q17.1 9 0 0Z" transform="translate(127 196) rotate(-15)" fill="var(--leaf)"/><path d="M0 0 Q14.4 -9 32 0 Q14.4 9 0 0Z" transform="translate(127 198) rotate(-50)" fill="var(--leaf)"/><path d="M0 0 Q15.3 -9 34 0 Q15.3 9 0 0Z" transform="translate(118 230) rotate(190)" fill="var(--leaf)"/><path d="M0 0 Q18.0 -8 40 0 Q18.0 8 0 0Z" transform="translate(44 160) rotate(-10)" fill="var(--leaf)"/><path d="M0 0 Q16.2 -7 36 0 Q16.2 7 0 0Z" transform="translate(30 200) rotate(185)" fill="var(--leaf)"/></svg>

<script>
const $=id=>document.getElementById(id);
const f=(v,s)=>(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=[],key="pt",CUR=null,MONTHS=[],SEASONS=new Map(),TOTAL=[];

function compute(games){
  const P=new Map();
  for(const [,seats] of games){
    seats.forEach(([id,name,pt],i)=>{
      let p=P.get(id); if(!p){p={id,name,pt:0,n:0,r:[0,0,0,0],vs:new Map()};P.set(id,p)}
      p.pt+=pt;p.n++;p.r[i]++;
      seats.forEach(([oid],j)=>{ if(j===i)return;
        let h=p.vs.get(oid); if(!h){h=[0,0,0,0];p.vs.set(oid,h)}
        h[0]++;h[1]+=pt;h[2]+=(i<j);h[3]+=i+1; });
    });
  }
  const L=[...P.values()].sort((a,b)=>b.pt-a.pt);
  const ix=new Map(L.map((p,i)=>[p.id,i]));
  return L.map((p,i)=>{const n=p.n,r=p.r;return{i,rank:i+1,name:p.name,pt:Math.round(p.pt*10)/10,n,r,
    avg:p.pt/n,ar:(r[0]+2*r[1]+3*r[2]+4*r[3])/n,top:r[0]/n,avoid:1-r[3]/n,
    vs:[...p.vs].map(([o,h])=>[ix.get(o),h[0],Math.round(h[1]*10)/10,h[2],h[3]])}});
}
function ymLabel(ym){return `${ym.slice(0,4)}年${+ym.slice(4)}月`}
function load(view){
  CUR=view;
  const games=view==="total"?TOTAL:SEASONS.get(view);
  D=compute(games);
  const ds=games.map(g=>g[0].slice(0,10)).sort(), a=ds[0]||"", b=ds[ds.length-1]||"";
  const latest=MONTHS[0];
  $("ttl").textContent=view==="total"?"通算 PTランキング":`${ymLabel(view)} PTランキング`;
  $("meta").innerHTML=(view==="total"?`<span>シーズン <b>${MONTHS.length}</b>(${ymLabel(MONTHS[MONTHS.length-1])}〜${ymLabel(latest)})</span>`:"")+
    `<span>集計期間 <b>${a.replace(/-/g,"/")} – ${b.replace(/-/g,"/")}</b></span><span>対局数 <b>${games.length}</b></span><span>参加者 <b>${D.length}</b>人</span>`;
  $("tabMonth").setAttribute("aria-selected",view===latest);
  $("tabTotal").setAttribute("aria-selected",view==="total");
  $("month").value=view==="total"?"":view;
  try{history.replaceState(null,"",view===latest?location.pathname:"#"+view)}catch(e){}
  if(dlg.open)dlg.close();
  render();
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  let L=D.filter(d=>!q||d.name.toLowerCase().includes(q));
  L=[...L].sort((a,b)=>key==="ar"?a.ar-b.ar:b[key]-a[key]);
  if(!L.length){$("tb").innerHTML='<tr><td colspan="9" class="empty">該当するプレイヤーがいない</td></tr>';return}
  $("tb").innerHTML=L.map(d=>`<tr class="${d.rank<=3?"top":""}">
<td class="rank">${d.rank<=3?`<span class="medal m${d.rank}">${d.rank}</span>`:d.rank}</td>
<td class="l name"><button class="pname" data-i="${d.i}" title="${esc(d.name)} の相性表を見る">${esc(d.name)}</button></td>
<td class="pt ${d.pt>=0?"plus":"minus"}">${f(d.pt,1)}</td>
<td class="num">${d.n}</td>
<td class="num ${d.avg>=0?"plus":"minus"}">${f(d.avg,2)}</td>

/* CSV 読み込み */
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell=""}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cell);rows.push(row);row=[];cell="" }
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}
function toGames(text){
  const rows=parseCSV(text.replace(/^﻿/,""));
  if(rows.length<2) throw new Error("CSVにデータ行がない。");
  const h=rows[0].map(s=>s.trim()); const col=n=>h.indexOf(n);
  const need=["開始時間"];for(let i=1;i<=4;i++)need.push(`${i}位プレイヤー名`,`${i}位最終点数`);
  const miss=need.filter(n=>col(n)<0);
  if(miss.length) throw new Error(`必要な列が見つからない: ${miss.join("、")}。雀魂の大会管理画面から書き出したCSVを選んでほしい。`);
  const hid=col("非表示状態"),games=[];let skipped=0;
  rows.slice(1).forEach((r,k)=>{
    if(hid>=0&&(r[hid]||"").trim().toLowerCase()==="yes"){skipped++;return}
    const seats=[];
    for(let i=1;i<=4;i++){
      const raw=(r[col(`${i}位プレイヤー名`)]||"").trim(), pt=parseFloat(r[col(`${i}位最終点数`)]);
      const m=raw.match(/^\[[^\]]*\]\[(\d+)\](.*)$/);
      if(!raw||isNaN(pt)) throw new Error(`${k+2}行目の${i}位のデータが読めない。`);
      seats.push(m?[m[1],m[2],pt]:[raw,raw,pt]);
    }
    const lk=col("牌譜リンク");
    games.push([(r[col("開始時間")]||"").trim(),seats,lk>=0?(r[lk]||"").trim():""]);
  });
  if(!games.length) throw new Error("集計できる対局がない。");
  return {games,skipped};
}
function decode(buf){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){return new TextDecoder("shift_jis").decode(buf)}
}
function fail(msg){$("tb").innerHTML=`<tr><td colspan="9" class="empty">${esc(msg)}</td></tr>`;$("meta").innerHTML=""}

/* シーズン(月)ファイルを探す
   1. GitHubのAPIでリポジトリ直下のファイル一覧を取り、YYYYMM.csv をすべて拾う
   2. APIが使えないとき(回数制限・独自ドメインなど)は、来月から過去へ順にファイルを確かめる */
const REPO_OWNER=location.hostname.endsWith(".github.io")?location.hostname.split(".")[0]:"";
const REPO_NAME=location.pathname.split("/").filter(Boolean)[0]||(REPO_OWNER?`${REPO_OWNER}.github.io`:"");
const isYM=s=>/^\d{4}(0[1-9]|1[0-2])$/.test(s);
async function listByApi(){
  if(!REPO_OWNER||!REPO_NAME) return null;
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/?t=${Date.now()}`);
    if(!r.ok) return null;
    const files=await r.json();
    return files.map(f=>f.name).filter(n=>/^\d{6}\.csv$/.test(n)).map(n=>n.slice(0,6)).filter(isYM);
  }catch(e){return null}
}
function prevYM(ym){let y=+ym.slice(0,4),m=+ym.slice(4)-1;if(m<1){m=12;y--}return `${y}${String(m).padStart(2,"0")}`}
async function probeBackward(){
  // 来月分から過去へ6か月ずつ確かめる。見つかった後に12か月続けて無ければ打ち切る(何も無ければ3年で打ち切る)
  const now=new Date(); let y=now.getFullYear(),m=now.getMonth()+2; if(m>12){m=1;y++}
  let ym=`${y}${String(m).padStart(2,"0")}`;
  const found=[];let miss=0,steps=0;
  while(steps<240){
    const batch=[];for(let j=0;j<6;j++){batch.push(ym);ym=prevYM(ym)}
    steps+=6;
    const res=await Promise.all(batch.map(async b=>[b,await loadSeason(b)]));
    for(const [b,g] of res){ if(g){found.push([b,g]);miss=0} else miss++ }
    if(found.length?miss>=12:steps>=36) break;
  }
  return found;
}
async function loadSeason(ym){
  const r=await fetch(`${ym}.csv?t=${Date.now()}`,{cache:"no-store"});
  if(!r.ok) return null;
  try{return toGames(decode(await r.arrayBuffer())).games}
  catch(err){console.warn(ym,err);BAD.push(`${ym}.csv(${err.message})`);return null}
}
const BAD=[];
function rebuild(){
  MONTHS=[...SEASONS.keys()].sort().reverse();
  if(!MONTHS.length) return false;
  const seen=new Set(); TOTAL=[];
  for(const ym of MONTHS) for(const g of SEASONS.get(ym)){ if(g[2]){if(seen.has(g[2]))continue;seen.add(g[2])} TOTAL.push(g) }
  $("month").innerHTML='<option value="" disabled>選択</option>'+MONTHS.map(ym=>`<option value="${ym}">${ymLabel(ym)}</option>`).join("");
  return true;
}
(async()=>{
  const listed=await listByApi();
  const res=listed&&listed.length
    ? await Promise.all(listed.map(async ym=>[ym,await loadSeason(ym)]))
    : await probeBackward();
  for(const [ym,g] of res) if(g) SEASONS.set(ym,g);
  if(!rebuild()){fail(BAD.length?`CSVを読めなかった: ${BAD.join("、")}`:"CSVが見つからない。リポジトリに 202609.csv のような「年4桁+月2桁.csv」の名前でCSVを置いてほしい。");return}
  const h=location.hash.slice(1);
  load(h==="total"||SEASONS.has(h)?h:MONTHS[0]);
  if(BAD.length) console.warn("読めなかったCSV:",BAD);
})();
$("tabMonth").addEventListener("click",()=>MONTHS.length&&load(MONTHS[0]));
$("tabTotal").addEventListener("click",()=>MONTHS.length&&load("total"));
$("month").addEventListener("change",e=>e.target.value&&load(e.target.value));
</script>
